<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>Kharkiv Air Map</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Kharkiv Air Map</h1>
      <div class="subtitle">Открытые и официальные источники • Харьков и область</div>
    </div>
    <div class="top-actions">
      <span id="status-dot" class="status-dot"></span>
      <span id="last-update">обновление…</span>
      <button id="refresh-btn" type="button">Обновить</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section class="panel">
        <div class="panel-title">Активные события</div>
        <div id="summary" class="summary">Загрузка…</div>
      </section>
      <section class="panel feed-panel">
        <div class="panel-title">Лента</div>
        <div id="feed" class="feed"></div>
      </section>
      <section class="panel compact">
        <div class="panel-title">Источники</div>
        <div id="sources" class="sources"></div>
      </section>
    </aside>

    <section class="map-wrap">
      <div id="map"><div class="map-loading">Загрузка карты…</div></div>
      <div class="legend">
        <span>FPV</span><span>Молнія</span><span>БПЛА / Shahed</span><span>Ракеты / КАБ</span>
      </div>
    </section>
  </main>

  <footer>Вспомогательная гражданская карта. Не заменяет официальные сигналы тревоги и указания ДСНС/ОВА.</footer>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    if (window.L) {
      const s = document.createElement('script');
      s.src = '/app.js?v=2';
      document.body.appendChild(s);
    } else {
      document.getElementById('map').innerHTML = '<div class="map-error">Не удалось загрузить библиотеку карты. Обновите страницу.</div>';
      document.getElementById('last-update').textContent = 'ошибка карты';
      document.getElementById('status-dot').className = 'status-dot err';
    }
  </script>
</body>
</html>
